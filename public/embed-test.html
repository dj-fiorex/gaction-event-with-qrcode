<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagina di test incorporamento &mdash; Gaction</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        color: #18181b;
        line-height: 1.5;
      }
      header {
        background: #18181b;
        color: #fafafa;
        padding: 24px 20px;
      }
      header .inner,
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      header p {
        margin: 6px 0 0;
        font-size: 14px;
        opacity: 0.8;
      }
      main {
        padding: 32px 20px 64px;
      }
      .lead {
        font-size: 15px;
        color: #52525b;
        margin: 0 0 24px;
      }
      .widget {
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        padding: 16px;
      }
      .widget h2 {
        margin: 0 0 12px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #71717a;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        background: #f4f4f5;
        padding: 2px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="inner">
        <h1>Sito partner (demo)</h1>
        <p>Pagina di test per il form di registrazione incorporato</p>
      </div>
    </header>
    <main>
      <p class="lead">
        Questa pagina simula un sito terzo che incorpora il form tramite lo
        snippet <code>&lt;script src=".../embed.js"&gt;</code>. Il form qui sotto
        &egrave; caricato in un iframe con ridimensionamento automatico.
      </p>
      <section class="widget">
        <h2>Registrazione evento</h2>
        <script
          src="https://vm-embeddable-registration-form.vusercontent.net/embed.js"
          data-event-id="k97asb0kds297qe16xeq8tz9ms89r926"
          async
        ></script>
      </section>
    </main>
  </body>
</html>
